               <!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#2563eb"
  >

  <meta
    name="description"
    content="Hasta ve ödeme takip uygulaması"
  >

  <title>Hasta Ödeme Takip</title>

  <link rel="manifest" href="manifest.json">

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <div id="app">

    <!-- ANA SAYFA -->

    <section id="homePage" class="page">

      <header class="top-header">

        <div>
          <h1>Hasta Takip</h1>
          <p>Ödeme takip sistemi</p>
        </div>

      </header>


      <main class="container">

        <!-- ARAMA -->

        <div class="search-box">

          <input
            type="text"
            id="searchInput"
            placeholder="Hasta ara..."
          >

        </div>


        <!-- HASTA LİSTESİ -->

        <div
          id="patientList"
          class="patient-list"
        ></div>

      </main>


      <!-- YENİ HASTA BUTONU -->

      <button
        id="addPatientButton"
        class="floating-button"
      >
        + Yeni Hasta
      </button>

    </section>



    <!-- HASTA DETAY SAYFASI -->

    <section
      id="patientPage"
      class="page hidden"
    >

      <header class="detail-header">

        <button
          id="backButton"
          class="back-button"
        >
          ←
        </button>

        <div>
          <h1 id="detailPatientName">
            Hasta
          </h1>

          <p id="detailPatientPhone">
          </p>
        </div>

      </header>


      <main class="container">

        <!-- HASTA BİLGİLERİ -->

        <div class="info-card">

          <h2>Hasta Bilgileri</h2>

          <p>
            Haftalık ücret:
            <strong id="detailPatientPrice">
              -
            </strong>
          </p>

        </div>


        <!-- YENİ ÖDEME -->

        <div class="payment-card">

          <h2>Ödeme Ekle</h2>


          <label for="paymentDate">
            Tarih
          </label>

          <input
            type="date"
            id="paymentDate"
          >


          <label for="paymentAmount">
            Tutar
          </label>

          <input
            type="number"
            id="paymentAmount"
            placeholder="Örn. 750"
          >


          <button
            id="savePaymentButton"
            class="primary-button"
          >
            Ödemeyi Kaydet
          </button>

        </div>


        <!-- ÖDEME GEÇMİŞİ -->

        <div class="history-card">

          <h2>Ödeme Geçmişi</h2>

          <div
            id="paymentHistory"
          ></div>

        </div>

      </main>

    </section>

  </div>



  <!-- HASTA EKLEME MODALI -->

  <div
    id="patientModal"
    class="modal hidden"
  >

    <div class="modal-content">

      <div class="modal-header">

        <h2>Yeni Hasta</h2>

        <button
          id="closeModalButton"
          class="close-button"
        >
          ×
        </button>

      </div>


      <label for="patientName">
        Ad Soyad
      </label>

      <input
        type="text"
        id="patientName"
        placeholder="Örn. Ahmet Yılmaz"
      >


      <label for="patientPhone">
        Telefon
      </label>

      <input
        type="tel"
        id="patientPhone"
        placeholder="05xx xxx xx xx"
      >


      <label for="patientPrice">
        Haftalık Ücret
      </label>

      <input
        type="number"
        id="patientPrice"
        placeholder="Örn. 750"
      >


      <div class="modal-buttons">

        <button
          id="cancelPatientButton"
          class="secondary-button"
        >
          İptal
        </button>

        <button
          id="savePatientButton"
          class="primary-button"
        >
          Hastayı Kaydet
        </button>

      </div>

    </div>

  </div>



  <!-- JAVASCRIPT -->

  <script src="app.js"></script>


  <!-- SERVICE WORKER -->

  <script>

    if ("serviceWorker" in navigator) {

      window.addEventListener(
        "load",
        () => {

          navigator.serviceWorker
            .register("sw.js")
            .catch(error => {

              console.log(
                "Service Worker hatası:",
                error
              );

            });

        }
      );

    }

  </script>

</body>
</html>
